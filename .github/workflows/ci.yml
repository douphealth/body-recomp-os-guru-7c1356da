name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'fix/**'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  supabase-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check billing edge functions
        run: |
          deno check supabase/functions/_shared/billing.ts
          deno check supabase/functions/billing-config/index.ts
          deno check supabase/functions/create-checkout/index.ts
          deno check supabase/functions/billing-status/index.ts
          deno check supabase/functions/create-billing-portal/index.ts
          deno check supabase/functions/premium-roadmap/index.ts
          deno check supabase/functions/stripe-webhook/index.ts
          deno check supabase/functions/plan-pdf/index.ts
